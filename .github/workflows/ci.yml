name: CI/CD - Sistema de Gestion Universitaria

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ===========================================================
  # SESION 1: Integracion Continua - dependencias y pruebas
  # ===========================================================
  test:
    name: Ejecutar pruebas unitarias de Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: universidad_db
          POSTGRES_USER: universidad_user
          POSTGRES_PASSWORD: universidad_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: universidad_db
      POSTGRES_USER: universidad_user
      POSTGRES_PASSWORD: universidad_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: clave-de-pruebas-ci
      DJANGO_DEBUG: "False"

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuracion del proyecto
        run: python manage.py check

      - name: Aplicar migraciones
        run: python manage.py migrate --noinput

      - name: Ejecutar pruebas unitarias
        run: python manage.py test -v 2

  # ===========================================================
  # SESION 3: Despliegue Continuo - build de la imagen Docker
  # ===========================================================
  build-docker:
    name: Construir imagen Docker (simulacion DockerHub)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen Docker
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME || 'universidad' }}/universidad-web:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME || 'universidad' }}/universidad-web:${{ github.sha }} \
            .

      - name: Verificar que la imagen arranca
        # Se omite el ENTRYPOINT con --entrypoint: entrypoint.sh espera y migra
        # contra PostgreSQL, y en este job no hay base de datos. Aqui solo se
        # comprueba que Django se inicializa dentro de la imagen.
        run: |
          docker images | grep universidad-web
          docker run --rm --entrypoint python \
            -e DJANGO_SECRET_KEY=clave-ci \
            ${{ secrets.DOCKERHUB_USERNAME || 'universidad' }}/universidad-web:latest \
            manage.py check

      # --- SIMULACION de la subida a DockerHub -------------------
      # En un entorno real se descomentan los dos pasos siguientes y se
      # configuran los secrets DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
      #
      # - name: Iniciar sesion en DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Publicar la imagen en DockerHub
      #   run: |
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/universidad-web:latest
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/universidad-web:${{ github.sha }}

      - name: Simular push a DockerHub
        run: |
          echo "=============================================="
          echo "[SIMULACION] docker push universidad/universidad-web:latest"
          echo "[SIMULACION] docker push universidad/universidad-web:${{ github.sha }}"
          echo "Imagen lista para desplegar en el servidor destino."
          echo "=============================================="
