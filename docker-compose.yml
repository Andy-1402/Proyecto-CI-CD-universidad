services:
  db:
    image: postgres:15
    container_name: universidad_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universidad_db}
      POSTGRES_USER: ${POSTGRES_USER:-universidad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universidad_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-universidad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - universidad_net

  web:
    build: .
    container_name: universidad_web
    restart: unless-stopped
    command: gunicorn universidad_project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-clave-solo-para-desarrollo}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-universidad_db}
      POSTGRES_USER: ${POSTGRES_USER:-universidad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-universidad_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - universidad_net

volumes:
  postgres_data:
  static_volume:

networks:
  universidad_net:
    driver: bridge
